name: NufeScheduleFree
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.1'
    CURRENT_PROJECT_VERSION: 2
    TARGETED_DEVICE_FAMILY: '1,2'
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) FREE_SIGNING
targets:
  NufeScheduleFree:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.local.nufeschedule.ios.free
        PRODUCT_NAME: NufeScheduleFree
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
    info:
      path: Config/Free-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: 南财课表
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: schedule
            CFBundleURLSchemes: [nufeschedule]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
schemes:
  NufeScheduleFree:
    build:
      targets:
        NufeScheduleFree: all
